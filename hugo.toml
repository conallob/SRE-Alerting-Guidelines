baseURL = "https://sre-alerting-guidelines.pages.dev/"
languageCode = "en-us"
title = "SRE Alerting Guidelines"
theme = "PaperMod"

[pagination]
pagerSize = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
title = "SRE Alerting Guidelines"
description = "A peer-to-peer style guide for writing effective alerts, previewed here ahead of publishing to writings.conall.dev"
author = "Conall O'Brien"
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = false
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

[params.profileMode]
enabled = true
title = "SRE Alerting Guidelines"
subtitle = "A peer-to-peer style guide for writing effective alerts — preview build, not the published site"
imageWidth = 120
imageHeight = 120

[[params.profileMode.buttons]]
name = "Guide"
url = "/projects/sre-alerting-guidelines/"

[[params.socialIcons]]
name = "github"
url = "https://github.com/conallob/SRE-Alerting-Guidelines"

[params.assets]
disableHLJS = false
disableFingerprinting = false

[params.label]
text = "SRE Alerting Guidelines"

[menu]

[[menu.main]]
identifier = "guide"
name = "Guide"
url = "/projects/sre-alerting-guidelines/"
weight = 10

[outputs]
home = ["HTML", "RSS", "JSON"]
