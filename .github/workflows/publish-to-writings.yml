name: Publish to writings.conall.dev

# Copies sre-alerting-guidelines.md into the published path of
# conallob/writings.conall.dev (content/projects/sre-alerting-guidelines/index.md)
# and pushes it to that repo's main branch, which Cloudflare then deploys.
# Requires the WRITINGS_DEPLOY_KEY secret: the private half of a deploy key
# (write access) registered on conallob/writings.conall.dev. Until the secret
# exists the workflow skips itself with a notice instead of failing.
#
# One-time setup:
#   1. ssh-keygen -t ed25519 -N "" -C "sre-alerting-guidelines publish" -f ./writings-deploy-key
#   2. On conallob/writings.conall.dev: Settings > Deploy keys > Add deploy key.
#      Paste writings-deploy-key.pub and tick "Allow write access".
#   3. On this repo: Settings > Secrets and variables > Actions > New repository
#      secret named WRITINGS_DEPLOY_KEY, containing writings-deploy-key (the
#      private key).
#   4. Delete both local key files.
#
# Run it by hand from the Actions tab (workflow_dispatch) to re-publish main.

on:
  push:
    branches: [main]
    paths:
      - sre-alerting-guidelines.md
      - .github/workflows/publish-to-writings.yml
  workflow_dispatch:

concurrency:
  group: publish-to-writings
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET_REPO: conallob/writings.conall.dev
  TARGET_PATH: content/projects/sre-alerting-guidelines/index.md

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check for deploy key
        id: key
        env:
          DEPLOY_KEY: ${{ secrets.WRITINGS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WRITINGS_DEPLOY_KEY is not set; skipping publish."
            echo "Skipped: WRITINGS_DEPLOY_KEY secret is not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out this repo
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Check out the writings repo
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: main
          ssh-key: ${{ secrets.WRITINGS_DEPLOY_KEY }}
          path: writings

      - name: Copy the guide into the published path
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p "writings/$(dirname "$TARGET_PATH")"
          cp sre-alerting-guidelines.md "writings/$TARGET_PATH"

      - name: Stamp the last-edited date
        if: steps.key.outputs.present == 'true'
        run: |
          merged_at=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
          merged_on=${merged_at%%T*}
          f="writings/$TARGET_PATH"
          sed -i \
            -e "s/{{LAST_EDITED}}/${merged_on}/" \
            -e "s/^lastmod: .*/lastmod: ${merged_at}/" \
            "$f"
          if grep -q '{{LAST_EDITED}}' "$f"; then
            echo "::error::LAST_EDITED placeholder was not replaced"
            exit 1
          fi

      - name: Commit and push if changed
        if: steps.key.outputs.present == 'true'
        working-directory: writings
        run: |
          git add "$TARGET_PATH"
          if git diff --cached --quiet; then
            echo "No changes to publish."
            echo "No changes to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync SRE Alerting Guidelines from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push origin HEAD:main
          echo "Published ${GITHUB_REPOSITORY}@${GITHUB_SHA::7} to ${TARGET_REPO}:${TARGET_PATH}." >> "$GITHUB_STEP_SUMMARY"
